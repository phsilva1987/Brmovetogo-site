name: Deploy BrMoveToGo Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: brmovetogo-site-production
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  S3_BUCKET: brmovetogo-site
  CLOUDFRONT_DISTRIBUTION_ID: E2K57WGDC7AHVV

jobs:
  deploy:
    name: Deploy to S3 and CloudFront
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Diagnose GitHub OIDC claims
        shell: bash
        run: |
          TOKEN="$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value')"
          PAYLOAD="$(printf '%s' "$TOKEN" | cut -d. -f2)"
          python3 - "$PAYLOAD" <<'PY'
          import base64, json, sys
          raw = sys.argv[1]
          raw += "=" * (-len(raw) % 4)
          claims = json.loads(base64.urlsafe_b64decode(raw).decode())
          for key in ("sub", "aud", "repository", "repository_owner", "ref", "event_name"):
              print(f"{key}={claims.get(key)}")
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::316356488279:role/GitHubActions-BrMoveToGo-Site
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync site to S3
        run: |
          aws s3 sync . "s3://${S3_BUCKET}/" \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".gitignore" \
            --exclude "README.md" \
            --exclude ".DS_Store"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"
